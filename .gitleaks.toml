title = "ChatHand source scan"
[extend]
useDefault = true

# This is a DER public key, pinned by Chrome to preserve the extension ID.
[[allowlists]]
description = "Chrome extension public identity key (not a credential)"
condition = "AND"
paths = ['''browser-extension/manifest\.json$''']
regexTarget = "secret"
regexes = ['''^\\E$''']
