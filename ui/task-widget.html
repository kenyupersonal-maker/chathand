<style>

:root{--widget-ink:#171A18;--widget-secondary:#5F6661;--widget-note:#929994;--widget-fill:rgba(16,24,40,.06);--widget-button-line:rgba(16,24,40,.15);--widget-ok:#00987B;--widget-warn:#B4600B;--widget-warn-soft:rgba(255,123,0,.09);--widget-warn-line:rgba(180,96,11,.22);--widget-primary:#171A18;--widget-on-primary:#FFFFFF;--widget-switch-off:rgba(16,24,40,.16);--widget-knob:#FFFFFF;--widget-knob-shadow:rgba(16,24,40,.25);--widget-tl-ok:#00987B;--widget-tl-ok-soft:rgba(0,152,123,.10);--widget-line:rgba(16,24,40,.15);--widget-line-solid:rgba(16,24,40,.26);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--widget-ink:#EDEEF0;--widget-secondary:#A6A9B0;--widget-note:#7C8089;--widget-fill:rgba(255,255,255,.08);--widget-button-line:rgba(255,255,255,.16);--widget-ok:#00E2B8;--widget-warn:#EBA04E;--widget-warn-soft:rgba(255,123,0,.12);--widget-warn-line:rgba(235,160,78,.30);--widget-primary:#F2F3F5;--widget-on-primary:#0B0C0E;--widget-switch-off:rgba(255,255,255,.22);--widget-knob:#FFFFFF;--widget-knob-shadow:rgba(0,0,0,.4);--widget-tl-ok:#00E2B8;--widget-tl-ok-soft:rgba(0,226,184,.12);--widget-line:rgba(255,255,255,.14);--widget-line-solid:rgba(255,255,255,.28);color-scheme:dark}}
:root[data-theme="dark"]{--widget-ink:#EDEEF0;--widget-secondary:#A6A9B0;--widget-note:#7C8089;--widget-fill:rgba(255,255,255,.08);--widget-button-line:rgba(255,255,255,.16);--widget-ok:#00E2B8;--widget-warn:#EBA04E;--widget-warn-soft:rgba(255,123,0,.12);--widget-warn-line:rgba(235,160,78,.30);--widget-primary:#F2F3F5;--widget-on-primary:#0B0C0E;--widget-switch-off:rgba(255,255,255,.22);--widget-knob:#FFFFFF;--widget-knob-shadow:rgba(0,0,0,.4);--widget-tl-ok:#00E2B8;--widget-tl-ok-soft:rgba(0,226,184,.12);--widget-line:rgba(255,255,255,.14);--widget-line-solid:rgba(255,255,255,.28);color-scheme:dark}
html,body{background:transparent}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--widget-ink)}
.card{padding:18px 20px}
.card.compact{padding:9px 20px}.card.compact>:not(#compact){display:none!important}.compact{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px;color:var(--widget-secondary);white-space:nowrap}.compact .ck{flex:none;color:var(--widget-ok);font-size:12px;font-weight:700}.compact .ct{min-width:0;overflow:hidden;text-overflow:ellipsis}
.top{display:flex;justify-content:space-between;gap:14px;color:var(--widget-secondary);font-size:12px}
.top strong{font-weight:600}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
h2{font-size:17px;line-height:1.4;font-weight:600;margin:0}
.state{display:inline-flex;align-items:center;gap:6px;background:var(--widget-fill);padding:2px 10px;border-radius:999px;font-size:12px}
.state.ok{color:var(--widget-ok)}.state.warn{color:var(--widget-warn)}
.res{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:2px 0 12px;align-items:baseline}
.res .k{font-size:12px;color:var(--widget-secondary);white-space:nowrap}
.res .v{font-size:15px;line-height:1.5;word-break:break-word}
.res .v.act{font-weight:600}
.res .v.none{color:var(--widget-secondary)}
.prog{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--widget-secondary)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--widget-fill);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--widget-ok);border-radius:3px;transition:width .3s}
.bar.warn>i{background:var(--widget-warn)}
.now{margin-top:6px;font-size:13px;color:var(--widget-secondary);word-break:break-all}
.alert{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--widget-warn-soft);border:1px solid var(--widget-warn-line);border-radius:12px;padding:8px 14px;color:var(--widget-warn);font-size:13px}
.alert b{font-weight:600}
p{color:var(--widget-secondary);margin:8px 0 0}
ul{padding-left:0;list-style:none;margin:10px 0 0;color:var(--widget-secondary);font-size:13px}
ul li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul .dir{color:var(--widget-note)}
button{font:inherit;font-size:13px;color:inherit;border:1px solid var(--widget-button-line);background:transparent;border-radius:8px;padding:4px 12px;cursor:pointer}
#permissionButtons button{border-radius:999px}
button.primary{background:var(--widget-primary);color:var(--widget-on-primary);border-color:var(--widget-primary)}
button:disabled{opacity:.5;cursor:default}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:12px;color:var(--widget-note)}
.auto{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--widget-secondary);font-size:12px}
/* 1025：开关样式，灰 = 关，绿 = 开（之前写成「：关」，看不出是状态还是按钮） */
.switch{position:relative;flex:none;width:32px;height:18px;padding:0;border:0;border-radius:9px;background:var(--widget-switch-off);cursor:pointer;transition:background-color .2s}
.switch>i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--widget-knob);box-shadow:0 1px 2px var(--widget-knob-shadow);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--widget-ok)}
.switch[aria-checked="true"]>i{transform:translateX(14px)}
@media(prefers-reduced-motion:reduce){.switch,.switch>i{transition:none}}
small{display:block;color:var(--widget-note);margin-top:10px;font-size:12px}
[hidden]{display:none!important}
#below{margin:8px 0 0;font-size:13px;color:var(--widget-secondary)}
.blocker{margin-top:12px;padding:10px 12px;border:1px solid var(--widget-warn-line);border-radius:12px;background:var(--widget-warn-soft);font-size:13px}
.blocker>b{display:block;color:var(--widget-warn);font-weight:600}
.blocker pre{margin:6px 0 0;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--widget-secondary);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.blocker p{margin:5px 0 0;font-size:12px}
.blocker-options{display:grid;gap:7px;margin-top:9px}
.blocker-option{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;align-items:center}
.blocker-option button{grid-row:1 / span 2}
.blocker-option small{margin:0}
.top,.foot{flex-wrap:wrap}.top>*{min-width:0;overflow-wrap:anywhere}.res{grid-template-columns:minmax(0,max-content) minmax(0,1fr)}.res .k{white-space:normal}.prog{flex-wrap:wrap}.bar{min-width:48px}.blocker-option{grid-template-columns:minmax(0,max-content) minmax(0,1fr)}button{white-space:normal;overflow-wrap:anywhere}h2,.state,.alert,.blocker-option{overflow-wrap:anywhere}
#blockerReply{color:var(--widget-warn);font-weight:600}
/* 1060（Claude）：总卡。结果带了 chathand/task_card 才加 .rich；颜色只上在状态那个词上，时间线照 ChatHand 窗口的样子（新的在上）。 */
.rfoot{display:contents}
.card.rich .head{flex-wrap:nowrap;margin:6px 0 2px}
.card.rich h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.rich .state{flex:none}
.state.mute{color:var(--widget-secondary)}
.card.rich #live,.card.rich #changes,.card.rich #alert,.card.rich #blockerStep,.card.rich #blockerError{display:none!important}
.card.rich .blocker{background:transparent;border-color:var(--widget-line)}
.card.rich .res{margin:10px 0 0}
.rprog{position:relative;height:21px;overflow:hidden;font-size:13px;line-height:21px;color:var(--widget-secondary)}
.rprog>span{position:absolute;left:0;right:0;top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rprog>span.in{animation:rp-in .24s ease-out both}
.rprog>span.out{animation:rp-out .24s ease-in both}
@keyframes rp-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes rp-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-9px)}}
.rbody{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
@media(min-width:600px){.rbody.has-files{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:28px}}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;column-gap:12px;min-height:40px}
.tl li:last-child{min-height:0}
.tl li:not(:last-child)::after{content:"";position:absolute;left:9.5px;top:20px;bottom:0;width:0;border-left:1px solid var(--widget-line)}
.tl li.ok:not(:last-child)::after,.tl li.tl-more::after{border-left-color:var(--widget-tl-ok)}
.tl li.fresh{animation:tl-in .3s ease-out both}
@keyframes tl-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.nd{box-sizing:border-box;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--widget-line);color:var(--widget-tl-ok)}
.nd .i{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.nd.ok{border-color:var(--widget-tl-ok);background:var(--widget-tl-ok-soft)}
.nd.run{position:relative}
.nd.run svg{position:absolute;left:-1px;top:-1px;width:20px;height:20px;overflow:visible;animation:nd-spin 1.6s linear infinite}
.nd.run circle{fill:none;stroke:var(--widget-tl-ok);stroke-width:1;stroke-linecap:round;stroke-dasharray:1 200;animation:nd-arc 1.4s ease-in-out infinite}
@keyframes nd-arc{0%{stroke-dasharray:1 200;stroke-dashoffset:0}50%{stroke-dasharray:42 200;stroke-dashoffset:-16}100%{stroke-dasharray:42 200;stroke-dashoffset:-59}}
@keyframes nd-spin{to{transform:rotate(360deg)}}
.nd.idle{position:relative;border-color:var(--widget-line-solid)}
.nd.idle i{position:absolute;left:50%;top:50%;width:1.2px;height:6.6px;margin:-6px 0 0 -.6px;border-radius:.6px;background:var(--widget-line-solid);transform-origin:50% calc(100% - .6px)}
.nd.idle i.m{animation:nd-spin 2.4s linear infinite}
.nd.idle i.h{animation:nd-spin 28.8s linear infinite;animation-delay:-9.6s}
.nd.warn,.nd.fail{border-color:var(--widget-warn);background:var(--widget-warn-soft);color:var(--widget-warn)}
.nd.stop{border-color:var(--widget-line-solid);color:var(--widget-secondary)}
.nd.stop .i{width:8px;height:8px;fill:currentColor;stroke:none}
.tl-b{min-width:0;padding-bottom:12px}
.tl-b b{display:block;font-size:14px;line-height:20px;font-weight:500;color:var(--widget-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl li.cur .tl-b b{font-weight:400;color:var(--widget-ink)}
.tl-b small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;margin:2px 0 0;font-size:12px;line-height:17px;color:var(--widget-note);overflow:hidden;overflow-wrap:break-word}
.tl-tm{font:12px/20px ui-monospace,"SF Mono",Menlo,monospace;color:var(--widget-note);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-tm.ok{color:var(--widget-tl-ok)}.tl-tm.warn{color:var(--widget-warn)}
.tl-link{padding:0;border:0;background:none;border-radius:0;font-size:13px;line-height:20px;color:var(--widget-secondary);text-decoration:underline;text-decoration-color:var(--widget-line);text-underline-offset:3px;text-align:left}
.tl-link:hover{color:var(--widget-ink)}
.tl li.tl-resume .tl-b b{font-weight:400;color:var(--widget-note)}
.tl li.tl-gap{display:block;min-height:0;padding-left:32px;font-size:12px;line-height:18px;color:var(--widget-note)}
.files{min-width:0}
.files h3{margin:0 0 4px;font-size:12px;line-height:20px;font-weight:500;color:var(--widget-note)}
.file{display:flex;align-items:center;gap:8px;box-sizing:border-box;width:calc(100% + 12px);min-height:32px;margin:0 -6px;padding:0 6px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;white-space:nowrap;overflow-wrap:normal}
.file:hover,.file:focus-visible{background:var(--widget-fill);outline:none}
.file .i{flex:none;width:15px;height:15px;fill:none;stroke:var(--widget-note);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--widget-ink)}
.file .fd{flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--widget-note)}
.file .fd.ok{color:var(--widget-tl-ok)}.file .fd.warn{color:var(--widget-warn)}
.files .tl-link{margin-top:4px;font-size:12px}
.files small{margin-top:4px}
.card.rich .rfoot{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:16px}
.ctl{display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px}
.ctl small{display:inline;margin:0}
.rnote{display:inline-flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0;font-size:12px;color:var(--widget-secondary)}
.card.rich .foot{margin:0}
button.stop:hover{border-color:var(--widget-warn-line);background:var(--widget-warn-soft);color:var(--widget-warn)}
button.danger{border-color:var(--widget-warn-line);color:var(--widget-warn)}
@media(prefers-reduced-motion:reduce){.nd.run svg,.nd.run circle,.nd.idle i,.rprog>span,.tl li.fresh{animation:none}.nd.run circle{stroke-dasharray:15 200}.nd.idle i.h{transform:rotate(120deg)}}
</style></head>

 for(const [index,option] of (blocker.options||[]).entries()){const row=document.createElement('div');row.className='blocker-option';const cost=document.createElement('small');cost.textContent=String(option.cost||'');if(option.action){const b=document.createElement('button');b.type='button';b.textContent=String(option.label||'');b.disabled=!cardNonce||cardSubmitted||Date.now()<cardReadyAt;b.onclick=()=>answerCard(String(index+1));row.append(b);}else{const label=document.createElement('strong');label.textContent=String(option.label||'');row.append(label);}row.append(cost);$('blockerOptions').append(row);}
 if((blocker.options||[]).some(o=>!o.action)&&current?.task?.last_checkpoint?.waiting_user===true)paintText($('blockerReply'),()=>T("blockerReply"));
}
function renderPermission(data){
 if(!cardReadyAt){cardReadyAt=Date.now()+1000;armTimer=setTimeout(()=>{if(!cardSubmitted)renderPermission(permissionData);},1001);}
 permissionData=data;rendered=true;cardKind='permission';stopTimer();$('permission').hidden=false;paintText($('title'),()=>T("permissionQuestion",{name:String(data.item?.name||T('capability'))}));paintText($('scope'),()=>data.conversation_title||'');paintText($('state'),()=>cardSubmitted?T("handled"):T("awaitDecision"));
 for(const id of ['live','res','blocker','alert','summary','cleanup','below','changes','foot','rprog','rbody','ctl','rnote'])$(id).hidden=true;
 $('permissionCause').textContent=data.cause||'';paintText($('permissionEffect'),()=>T("permissionEffect",{effect:String(data.effect?.can_do||'')}));paintText($('permissionRisk'),()=>T("permissionRisk",{risk:String(data.effect?.risk||'')}));$('permissionButtons').replaceChildren();
 if(data.chat_ok===false){paintText($('permissionResult'),()=>T("permissionInWindow"));return;}
 for(const [choice,label] of [['always','allow'],['deny','deny']]){if(choice!=='deny'&&!data.scopes?.includes(choice))continue;const b=document.createElement('button');b.type='button';paintText(b,()=>T(label));b.className=choice==='always'?'primary':'';b.disabled=cardSubmitted||!cardNonce||Date.now()>=data.expires_at||Date.now()<cardReadyAt;b.onclick=()=>answerCard(choice);$('permissionButtons').append(b);}
 clearTimeout(permissionTimer);const remaining=Number(data.expires_at)-Date.now();paintText($('permissionExpiry'),()=>remaining>0?T("permissionExpiry",{count:Math.ceil(remaining/60000)}):T("cardExpired"));if(remaining>0&&!cardSubmitted){permissionTimer=setTimeout(()=>closePermission(()=>T("confirmationExpired")),remaining);if(!permissionPoll&&cardNonce)permissionPoll=setTimeout(pollPermission,3000);}reportHeight();
}
function closePermission(line){cardSubmitted=true;cardNonce=null;clearTimeout(permissionPoll);permissionPoll=null;clearTimeout(permissionTimer);clearTimeout(armTimer);document.querySelector('.card').classList.add('compact');$('compact').hidden=false;paintText($('compactText'),typeof line==='function'?line:()=>line);reportHeight();}
// 1052：在别处（窗口、通知）答了，卡要跟着收起。用这张卡自己的凭据 card_answer {choice:'status'} 私下查，不消耗凭据；task_status(from_card) 会算成 AI 在动，还会作废接力卡（方案 A2 第 7 处）。
// 没有凭据就不查，到点由过期计时收起；ChatHand 回了错误码（凭据失效、任务没了）就收起，不再查；网络一类的错误 10 秒后再试。
async function pollPermission(){
 permissionPoll=null;const nonce=cardNonce;if(cardSubmitted||!permissionData||!nonce)return;
 let next=5000;
 try{const r=await call('card_answer',{nonce,choice:'status'});if(cardSubmitted)return;const s=r?.state;if(s&&s!=='waiting'&&s!=='applying'){closePermission(()=>s==='withdrawn'?T("requestWithdrawn"):s==='expired'?T("confirmationExpired"):T("answeredElsewhere",{result:s==='allowed'?T('allowed'):s==='denied'?T('denied'):T('resultUnconfirmed')}));return;}}
 catch(e){if(cardSubmitted)return;if(/^[A-Z][A-Z0-9_]+$/.test(String(e?.message||''))){closePermission(()=>T("invalidPermission"));return;}next=10000;}
 if(!cardSubmitted&&Date.now()<permissionData.expires_at)permissionPoll=setTimeout(pollPermission,next);
}
async function answerCard(choice){
 if(cardSubmitted||!cardNonce||Date.now()<cardReadyAt)return;cardSubmitted=true;const nonce=cardNonce;cardNonce=null;clearTimeout(permissionTimer);clearTimeout(permissionPoll);clearTimeout(armTimer);document.querySelectorAll('#permissionButtons button,#blockerOptions button').forEach(b=>b.disabled=true);
 const resultEl=$(cardKind==='permission'?'permissionResult':'blockerReply');paintText(resultEl,()=>T("processing"));
 try{const r=await call('card_answer',{nonce,choice});paintText(resultEl,()=>r.result_line||T("handled"));paintText($('state'),()=>r.state==='unknown'?T("resultUnconfirmed"):T("handled"));if(r.ok&&['allowed','denied'].includes(r.state)){let line=()=>r.result_line||T('handled');if(r.ai_waiting===true)line=()=>T("resultWillContinue",{result:r.result_line||T('handled')});else if(r.ai_waiting===false){const prompt=choice==='deny'?T("denyPrompt"):T("answerPrompt");let notified=false;try{if(typeof window.openai?.sendFollowUpMessage==='function'){await window.openai.sendFollowUpMessage({prompt});notified=true;}}catch{}line=()=>notified?T("resultNotified",{result:r.result_line||T('handled')}):T("resultTellChatGPT",{result:r.result_line||T('handled')});}closePermission(line);}}
 catch{paintText(resultEl,()=>T("answerUnconfirmed"));paintText($('state'),()=>T("resultUnconfirmed"));}reportHeight();
}
const supersededError=e=>['RELAY_CARD_SUPERSEDED','RELAY_CARD_INVALID'].includes(e?.message);
// 1049: official host bridge only. This private control MUST NOT fall back to parent ui/message.
async function relayCall(args){
 const bridge=window.openai?.callTool;
 if(typeof bridge!=='function')throw Error('RELAY_HOST_BRIDGE_UNAVAILABLE');
 const r=await bridge.call(window.openai,'relay_card_control',args);
 if(r?.isError)throw Error(r?.structuredContent?.code||'RELAY_CONTROL_ERROR');
 acceptMetadata(r);
 return r?.structuredContent??r;
}
function relayPrompt(id,kind){
 const key=kind==='split_smaller'?'relayPromptSplit':kind==='wait_done'?'relayPromptDone':kind==='wait_over'?'relayPromptOver':'relayPromptContinue';
 return T(key,{id});
}
async function relayPoll(){
 if(collapsed||!current?.task?.task_id||document.visibilityState==='hidden')return;
 const id=current.task.task_id;
 if(relayToken){
  const sent=cardErrN>0&&current?.task?.relay?.report_errors===true?{n:cardErrN,codes:[...cardErrCodes]}:null;
  try{
   const result=await relayCall({action:'view',task_id:id,card_token:relayToken,...(sent?{card_errors:sent}:{})});
   if(sent){cardErrN=Math.max(0,cardErrN-sent.n);for(const c of sent.codes)cardErrCodes.delete(c);}
   if(result?.task&&current?.task?.task_id===id)render({task:{...result.task,relay:result.relay},changes:current.changes,scope:current.scope});
  }catch(e){
   // 1052（Claude）：这张卡已被新卡取代（或不属于这段对话了）：收起来，不再查。原来会一直报错重查到 12 分钟。
   // 后端按 1052 方案 A2 第 8 处认出旧卡后回 RELAY_CARD_SUPERSEDED，而且不算 AI 在动；认不出的回 RELAY_CARD_INVALID。两种都收起。
   if(supersededError(e)){if(current?.task?.task_id===id&&!collapsed){renderCompact(originCheckpoint||current.task.last_checkpoint);return;}}
   else noteCardError(e);
   /* The private bridge is unavailable; manual ChatGPT input remains the fallback. */
  }
 }
 if(relayInterruptToken&&current?.task?.task_id===id)await relayInterrupt(id);
}
// 1052（Claude）：停住了，而这张卡的接力已经作废（AI 后来又调了工具，或者之前接上过）：用 ChatHand 在私有 view 里给的凭据，换一张「手动继续」卡。
// 不再用 task_status 去要凭据：它不是私有调用，会被算成 AI 在动，当场把「停住了」清掉，还会作废同一对话里别的卡。
async function relayInterrupt(id){
 if(relayInterrupting)return;
 const proof=relayInterruptToken;relayInterruptToken=null;if(!proof||usedInterruptTokens.has(proof))return;usedInterruptTokens.add(proof);
 relayInterrupting=true;
 try{
  const result=await relayCall({action:'interruption',task_id:id,interruption_token:proof});
  if(result?.relay&&relayToken&&current?.task?.task_id===id)render({task:{...current.task,relay:result.relay},changes:current.changes,scope:current.scope});
 }catch(e){noteCardError(e);/* 换不到就保留「发继续」的提示 */}finally{relayInterrupting=false;}
}
async function relayDispatch(id,mode){
 if(relaySending||!relayToken||collapsed||document.visibilityState==='hidden')return;
 if(typeof window.openai?.sendFollowUpMessage!=='function'||typeof window.openai?.callTool!=='function'){alertLine(()=>T("bridgeUnavailable"));return;}
 const token=relayToken,generation=relayGeneration,kind=current?.task?.relay?.prompt_kind;relaySending=true;clearTimeout(relayTimer);paintControls();
 let claiming=true;
 try{
  const claimed=await relayCall({action:'claim',task_id:id,card_token:token,mode,...(mode==='manual'?{request_id:crypto.randomUUID()}:{})});
  claiming=false;
  if(!claimed?.granted){if(mode==='manual')setNote(()=>claimed?.reason==='tool_inflight'?T("toolInflight"):T("relayNotStarted"));return;}
  const permit=relayPermit;relayPermit=null;
  if(generation!==relayGeneration||current?.task?.task_id!==id||!permit)return;
  await relaySend(id,permit,generation,kind);
 }catch(e){
  // 1052（Claude）：点的时候这张卡已被新卡取代：什么都没发，收起来，用最新那张卡。
  if(claiming&&supersededError(e)&&current?.task?.task_id===id&&!collapsed){renderCompact(originCheckpoint||current.task.last_checkpoint);return;}
  if(!supersededError(e))noteCardError(e);
  alertLine(()=>T("relayUnconfirmed"));
 }
 finally{relaySending=false;void relayPoll();}
}
// 领到许可后都从这里发（接力卡手动/自动接、总卡「继续」）：begin_dispatch 消耗许可，send:true 才经 sendFollowUpMessage 发一次，再回报结果。
async function relaySend(id,permit,generation,kind){
 const dispatch=await relayCall({action:'begin_dispatch',task_id:id,permit_token:permit});
 if(!dispatch?.send)return;
 let outcome='unknown',error_code=null,definitely_not_sent=false,output_conflict=null,input_conflict=null;
 if(generation===relayGeneration&&current?.task?.task_id===id&&document.visibilityState!=='hidden'){
  try{
   await window.openai.sendFollowUpMessage({prompt:relayPrompt(id,kind)});
   outcome='accepted';
  }catch(error){
   const details=error?.details;
   if(Number.isSafeInteger(error?.code)&&details?.definitely_not_sent===true){outcome='rejected';error_code=error.code;definitely_not_sent=true;}
   if(typeof details?.output_conflict==='boolean')output_conflict=details.output_conflict;
   if(typeof details?.input_conflict==='boolean')input_conflict=details.input_conflict;
   // No string/error-message heuristics; unknown sends must never be retried blindly.
  }
 }
 try{await relayCall({action:'report',task_id:id,attempt_id:dispatch.attempt_id,report_token:permit,outcome,...(error_code!==null?{error_code}:{}),definitely_not_sent,...(output_conflict!==null?{output_conflict}:{}),...(input_conflict!==null?{input_conflict}:{})});}
 catch(e){noteCardError(e);/* A lost report remains unknown server-side, not a retry invitation. */}
 const reportedOutcome=outcome;setNote(()=>reportedOutcome==='accepted'?T("relayAccepted"):reportedOutcome==='unknown'?T("relayUnknown"):T("relayRejected"));
}
// 1052 第四版（Claude）：取消以后照旧拿这张卡的凭据私下查（view），不再把凭据丢掉。原来丢了凭据就改调 task_status(from_card)，
// 那会被算成 AI 在动，还会作废同一对话里的卡。还停着的，ChatHand 换一张只能手动的卡（这一块不再自动发，方案 A4-4），卡上给「手动继续」。
async function relayCancel(id){
 const token=relayToken;relayGeneration++;clearTimeout(relayTimer);
 if(token)try{await relayCall({action:'cancel',task_id:id,card_token:token});}catch(e){noteCardError(e);}
 alertLine(()=>T("relayCancelled"));
}
// 1052（Claude）：「手动继续」按钮。服务端 relay-keeper 的 _view/_gate 对手动不看本安装是否开了自动接力，只要 manual_allowed 就收；
// 原来这里多要求了 auto_enabled，没开自动接力时按钮永远出不来，只能自己打「继续」。
function manualLine(t,line){if(rich){richManualId=t.task_id;alertLine(line);return;}const b=document.createElement('button');b.type='button';paintText(b,()=>T("manualContinue"));b.onclick=()=>relayDispatch(t.task_id,'manual');alertLine(line,b);}
// 1052 第四版（Claude）：倒计时前面说明为什么要接；手动卡写清是哪种停住（方案 A4-4）。设置里的开关叫「自动接着做」。
function relayCountdown(r,count){
 const context=r.wait?.state==='done'?'done':r.wait?.state==='over'?'over':r.purpose==='interruption'?(r.prompt_kind==='split_smaller'?'again':'stalled'):'ready';
 return T('countdown.'+context+(r.prompt_kind==='split_smaller'?'.split':'.continue'),{count});
}
function manualKey(r){return r.auto_skipped==='block_limit'?'manualBlockLimit':r.wait?.state==='done'?'manualWaitDone':r.wait?.state==='over'?'manualWaitOver':r.purpose==='interruption'?'manualStalled':'manualNotConnected';}
function manualText(r){return T(manualKey(r));}
function renderAlert(t,stalled,live){
 clearTimeout(relayTimer);richManualId=null;
 if(!live){alertLine('');return;}
 const relay=t.relay,appReady=typeof window.openai?.callTool==='function'&&typeof window.openai?.sendFollowUpMessage==='function';
 if(relayToken&&relay?.available&&relay.checkpoint_seq===t.checkpoint_seq&&!relay.cancelled){
  // 停住时 AI 正在等一条命令：命令跑完以前不发、不给按钮（ChatHand 这时 ready_at 是 null，自动领会回 too_early）。
  if(relay.wait?.state==='running'&&['armed','manual_ready'].includes(relay.state)){
   if(relay.state==='armed'&&relay.auto_enabled===true){const b=document.createElement('button');b.type='button';paintText(b,()=>T("cancel"));b.onclick=()=>relayCancel(t.task_id);alertLine(()=>T("waitCommandAuto"),b);}
   else alertLine(A('waitCommandManual'));
   return;
  }
  if(['armed','retry_wait'].includes(relay.state)){
   const retry=relay.state==='retry_wait',auto=relay.auto_enabled===true;
   if(!auto){
    // 和自动接着做一样先等倒计时：这段时间 AI 多半还在说最后一句或已经接着调工具（一调工具这张卡就作废），不打扰；到点还没动静才给按钮。
    const wait=Math.max(0,(Number(relay.ready_at)||0)-Date.now());
    if(wait>0){alertLine('');if(document.visibilityState!=='hidden')relayTimer=setTimeout(()=>renderAlert(current.task,current.task.stall?.stalled===true,true),wait+50);return;}
    if(relay.manual_allowed&&appReady)manualLine(t,A('autoOffManual'));
    else alertLine(()=>T("autoOffPrompt"));
    return;
   }
   if(!appReady){alertLine(()=>T("bridgeUnavailable"));return;}
   const left=Math.max(0,Math.ceil(((Number(relay.ready_at)||0)-Date.now())/1000)),sending=relaySending;
   if(left===0&&!relaySending&&document.visibilityState!=='hidden')queueMicrotask(()=>relayDispatch(t.task_id,'auto'));
   const b=document.createElement('button');b.type='button';paintText(b,()=>T("cancel"));b.onclick=()=>relayCancel(t.task_id);
   alertLine(()=>left>0?relayCountdown(relay,left):sending?T("checkingPermission"):T("relayPreparing"),b);
   if(left>0&&document.visibilityState!=='hidden')relayTimer=setTimeout(()=>renderAlert(current.task,current.task.stall?.stalled===true,true),1000);
   return;
  }
  if(relay.state==='manual_ready'&&relay.manual_allowed&&appReady){manualLine(t,A(manualKey(relay)));return;}
  if(relay.state==='awaiting'||relay.state==='dispatching'){alertLine(()=>T("relayAwaiting"));return;}
  if(relay.state==='unknown'){alertLine(()=>T("relayUnknownNoRepeat"));return;}
  if(relay.state==='resumed'&&!stalled){alertLine(()=>T("relayResumed"));return;}
  if(relay.state==='limit'){const count=Number(relay.max_auto_rounds)||5;if(relay.manual_allowed&&appReady)manualLine(t,A('autoLimitManual',{count}));else alertLine(()=>T("autoLimitPrompt",{count}));return;}
 }
 if(stalled){alertLine(A('stalledPrompt'));return;}
 const s=t.stall,risky=['maybe','likely'].includes(t.forecast),idle=!!s&&!s.running&&!s.waiting_user&&!s.waiting_job&&(t.wait_state?.kind||'ai')==='ai',quiet=quietNow(s);
 if(risky&&idle&&quiet<NEAR_STALL_MS&&document.visibilityState!=='hidden')relayTimer=setTimeout(()=>renderAlert(current.task,current.task.stall?.stalled===true,true),NEAR_STALL_MS-quiet+50);
 alertLine(()=>risky&&idle&&quiet>=NEAR_STALL_MS?retryTip():'');
}
async function poll(){
 if(collapsed||!current?.task?.task_id||document.visibilityState==='hidden'||!pollBudgetLeft())return;
 if(relayToken){await relayPoll();return;}
 // New task cards use a read-only capability. Old cards retain bounded ordinary polling.
 try{const r=observationNonce?await call('card_answer',{nonce:observationNonce,choice:'status'}):await call('task_status',{task_id:current.task.task_id,from_card:true});if(r?.task)render({...r,changes:current.changes,scope:current.scope});else if(r?.task_id)render({task:r,changes:current.changes,scope:current.scope});if(relayInterruptToken)await relayInterrupt(current.task.task_id);}catch(e){if(observationNonce&&['CONFIRM_NONCE_INVALID','TASK_MISSING','TASK_OWNER'].includes(e?.message)){observationNonce=null;collapsed=true;stopTimer();alertLine(()=>T("invalidTask"));}}
}
// 1052（Claude）：最新的卡一直看着，AI 中途停住也能发现（原来 360 次、约 12 分钟后就不查了）；被新卡取代的卡收起来，不再查。
// 1052 第四版（Claude，Ken 10/14：卡片查一次也走 ChatGPT，统计照算）：查的次数砍掉约一半，数和方案 A3 第 6 条一样：
// 接力正在动（自动倒计时、领许可、发送、等接上、等重试）每 2 秒；在等命令跑完每 30 秒；其余记进度后 20 分钟内每 15 秒，之后每 60 秒。
// 没有接力凭据的卡（show_task 卡）每 30 秒、只查 10 分钟。从记进度那一刻算，最多看 2 小时。
function cardAge(){return Date.now()-cardBorn;}
function pollBudgetLeft(){const age=cardAge();return age<=7200000&&(!!relayToken||!!observationNonce||age<=600000);}
function pollGap(){
 if(!relayToken)return 30000;
 const r=current?.task?.relay,st=r?.state;
 if(r?.wait?.state==='running')return 30000;
 if(['retry_wait','permit','dispatching','awaiting'].includes(st)||st==='armed'&&r?.auto_enabled===true)return 2000;
 return cardAge()<1200000?15000:60000;
}
// 已经排了更早的一次就不往后推：卡片重画（宿主改主题、改高度时也会重画）不能把下一次查一直往后拖。
function stopTimer(){clearTimeout(timer);timerDue=0;}
function schedule(live,ms=pollGap()){
 if(!live||collapsed||!pollBudgetLeft()){stopTimer();return;}
 const due=Date.now()+ms;if(timerDue&&timerDue<=due)return;
 clearTimeout(timer);timerDue=due;
 timer=setTimeout(()=>{timerDue=0;polls++;if(document.visibilityState!=='hidden')void poll();schedule(current?.task?.status==='active');},ms);
}
window.addEventListener('pagehide',()=>{relayGeneration++;relayToken=null;relayPermit=null;relayInterruptToken=null;observationNonce=null;hostFlowCapability=null;taskControlNonce=null;taskControls=null;clearTimeout(relayTimer);stopTimer();});
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden'){clearTimeout(relayTimer);stopTimer();}
 else{void poll();if(current?.task?.status==='active')schedule(true);}
});
window.addEventListener('message',e=>{if(e.source!==window.parent||!e.data||e.data.jsonrpc!=='2.0')return;const m=e.data;if(m.id&&pending.has(m.id)){const p=pending.get(m.id);clearTimeout(p.t);pending.delete(m.id);m.error?p.reject(Error(m.error.message||'error')):p.resolve(m.result);}
 if(m.method==='ui/notifications/tool-result'){acceptMetadata(m.params);render(m.params?.structuredContent);}if(m.method==='ui/notifications/host-context-changed'){setTheme(m.params?.theme);applyHostLocale(m.params?.locale,true);}});
function acceptWidgetState(s){const id=s&&typeof s==='object'?s.chathand_resume_sent:null;if(typeof id==='string'&&id.length<=200&&!resumeSentFor)resumeSentFor=id;}
window.addEventListener('openai:set_globals',()=>{acceptWidgetState(window.openai?.widgetState);setTheme(window.openai?.theme);applyHostLocale(window.openai?.locale,true);acceptMetadata(window.openai?.toolResponseMetadata);if(window.openai?.toolOutput&&!cardSubmitted)render(window.openai.toolOutput);});
// 1023：把卡片实际的高度告诉 ChatGPT，免得下面留一大块空白。
let lastHeight=0;function reportHeight(){const h=Math.ceil(document.querySelector('.card')?.getBoundingClientRect().height||0);if(!h||h===lastHeight)return;lastHeight=h;try{window.openai?.notifyIntrinsicHeight?.(h);}catch{}if(window.parent!==window)window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:h}},'*');}
try{new ResizeObserver(reportHeight).observe(document.querySelector('.card'));}catch{}
for(const node of document.querySelectorAll('[data-local-text]'))paintText(node,()=>T(node.dataset.localText));
window.ChatHandText.subscribe(refreshText);
refreshText();
if(window.openai?.theme)setTheme(window.openai.theme);
applyHostLocale(window.openai?.locale,true);
acceptWidgetState(window.openai?.widgetState);
acceptMetadata(window.openai?.toolResponseMetadata);if(window.openai?.toolOutput)render(window.openai.toolOutput);
if(window.parent!==window)send('ui/initialize',{appInfo:{name:'chathand-task',version:'1.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(r=>{setTheme(r?.hostContext?.theme);applyHostLocale(r?.hostContext?.locale,true);window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');lastHeight=0;reportHeight();}).catch(()=>{});
